<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Agendamento</title>

<link rel="stylesheet" href="main.css">
</head>
<body>

<div class="container">

    <h1>🏥 Sistema de Agendamento de Pacientes</h1>

    <div class="card">

        <div class="form-grid">

            <div>
                <label>Paciente</label>
                <input type="text" id="nome">
            </div>

            <div>
                <label>Telefone</label>
                <input type="text" id="telefone">
            </div>

            <div>
                <label>Data</label>
                <input type="date" id="data">
            </div>

            <div>
                <label>Horário</label>
                <input type="time" id="horario">
            </div>

        </div>

        <br>

        <button onclick="adicionarConsulta()">
            Agendar Consulta
        </button>

    </div>

    <div class="card">

        <h2>Consultas Agendadas</h2>

        <br>

        <table>
            <thead>
                <tr>
                    <th>Paciente</th>
                    <th>Telefone</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="listaConsultas">
            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
