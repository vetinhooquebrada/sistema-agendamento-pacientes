<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Médica</title>

    <link rel="stylesheet" href="main.css">
</head>

<body>

<div class="container">

    <h1>📅 Agenda Médica</h1>

    <p class="subtitulo">
        Gerencie consultas de forma rápida e organizada
    </p>

    <div class="card">

        <div class="form-grid">

            <div>
                <label for="nome">Paciente</label>
                <input type="text" id="nome" placeholder="Nome do paciente">
            </div>

            <div>
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(17) 99999-9999">
            </div>

            <div>
                <label for="data">Data</label>
                <input type="date" id="data">
            </div>

            <div>
                <label for="horario">Horário</label>
                <input type="time" id="horario">
            </div>

        </div>

        <button onclick="adicionarConsulta()">
            ➕ Agendar Consulta
        </button>

    </div>

    <div class="card">

        <h2>📅 Agenda Semanal</h2>

        <div class="agenda-semanal">

            <div class="dia">
                <h3>SEGUNDA</h3>
                <div id="segunda"></div>
            </div>

            <div class="dia">
                <h3>TERÇA</h3>
                <div id="terca"></div>
            </div>

            <div class="dia">
                <h3>QUARTA</h3>
                <div id="quarta"></div>
            </div>

            <div class="dia">
                <h3>QUINTA</h3>
                <div id="quinta"></div>
            </div>

            <div class="dia">
                <h3>SEXTA</h3>
                <div id="sexta"></div>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
